<!DOCTYPE html>
<html>
<head>
    <title>Shreya's Website</title>
    <style>
        body {
            background-color: lightblue;
            text-align: center;
        }
        h1 {
            color: darkblue;
        }
        p {
            color: black;
            font-size: 18px;
        }
        img {
            border-radius: 50%;
            margin-top: 20px;
        }
        button {
            background-color: pink;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            margin-top: 20px;
            margin-right: 10px;
        }
        a {
            display: block;
            margin-top: 20px;
            color: darkblue;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Hello, I am Shreya!</h1>
    <img src="https://placehold.co/150" alt="My Profile Picture">
    <p>I am learning Full Stack Development.</p>
    
    <a href="https://github.com/Shreya-k8" target="_blank">Visit my GitHub Profile</a>
    
    <button id="myBtn">Click Me!</button>
    <button id="darkBtn">Dark Mode</button>
    <button id="lightBtn">Light Mode</button>

    <script>
        document.getElementById("myBtn").addEventListener("click", function() {
            document.body.style.backgroundColor = "pink";
        });

        document.getElementById("darkBtn").addEventListener("click", function() {
            document.body.style.backgroundColor = "black";
            document.querySelector("h1").style.color = "white";
            document.querySelector("p").style.color = "white";
            document.querySelector("a").style.color = "lightblue";
        });

        document.getElementById("lightBtn").addEventListener("click", function() {
            document.body.style.backgroundColor = "lightblue";
            document.querySelector("h1").style.color = "darkblue";
            document.querySelector("p").style.color = "black";
            document.querySelector("a").style.color = "darkblue";
        });
    </script>
</body>
</html>
